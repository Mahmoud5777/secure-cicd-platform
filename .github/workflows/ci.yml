
name: Secure CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build, Test, Snyk Scan and AI Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and run tests
        run: chmod +x mvnw && ./mvnw clean verify

      - name: Install Snyk CLI
        run: npm install -g snyk

      - name: Run Snyk security scan
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --json-file-output=snyk-report.json

      - name: Upload Snyk report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snyk-security-report
          path: snyk-report.json
          if-no-files-found: warn

      - name: Start Spring Boot application
        if: hashFiles('snyk-report.json') != ''
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          nohup ./mvnw spring-boot:run > app.log 2>&1 &
          echo $! > app.pid

          for i in {1..30}; do
            if curl -fsS http://localhost:8080/api/status; then
              echo "Spring Boot application is ready."
              exit 0
            fi
            sleep 5
          done

          echo "Spring Boot application failed to start."
          cat app.log
          exit 1

      - name: Send Snyk report for AI analysis
        if: hashFiles('snyk-report.json') != ''
        run: |
          curl --fail-with-body \
            --max-time 600 \
            -X POST \
            -F "file=@snyk-report.json;type=application/json" \
            http://localhost:8080/api/security/analyze \
            -o ai-security-analysis.txt

      - name: Upload AI analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snyk-ai-analysis
          path: ai-security-analysis.txt
          if-no-files-found: warn

      - name: Display AI analysis
        if: success() && hashFiles('ai-security-analysis.txt') != ''
        run: cat ai-security-analysis.txt
