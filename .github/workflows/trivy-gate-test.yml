name: Trivy Security Gate Test

on:
  push:
    branches:
      - test/security-gates

permissions:
  contents: read

jobs:
  trivy-test:
    name: Test Trivy Blocking Behavior
    runs-on: ubuntu-latest

    steps:
      - name: Scan intentionally vulnerable test image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: alpine:3.12
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH