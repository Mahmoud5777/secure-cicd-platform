
name: Secure CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build, Test, SonarQube, Snyk and AI Analysis
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Set up Java 21
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 3. Build and run tests
      - name: Build and run tests
        run: chmod +x mvnw && ./mvnw clean verify

      # 4. SonarQube Cloud Analysis
      - name: SonarQube Cloud Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./mvnw sonar:sonar \
            -Dsonar.organization=mahmoud5777 \
            -Dsonar.projectKey=Mahmoud5777_secure-cicd-platform \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.qualitygate.wait=true

      # 5. Install Snyk CLI
      - name: Install Snyk CLI
        run: npm install -g snyk

      # 6. Run Snyk security scan
      - name: Run Snyk security scan
        id: snyk_scan
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          set +e
          snyk test --json-file-output=snyk-report.json
          SNYK_EXIT_CODE=$?
          set -e

          echo "Snyk exit code: $SNYK_EXIT_CODE"

          if [ "$SNYK_EXIT_CODE" -ge 2 ]; then
            echo "Snyk scan failed due to a technical error."
            exit "$SNYK_EXIT_CODE"
          fi

          if [ ! -s snyk-report.json ]; then
            echo "Snyk report was not generated."
            exit 1
          fi

      # 7. Upload Snyk report
      - name: Upload Snyk report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snyk-security-report
          path: snyk-report.json
          if-no-files-found: warn

      # 8. Start Spring Boot application
      - name: Start Spring Boot application
        if: steps.snyk_scan.outcome == 'success' && hashFiles('snyk-report.json') != ''
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          nohup ./mvnw spring-boot:run > app.log 2>&1 &
          echo $! > app.pid

          for i in {1..30}; do
            if curl -fsS http://localhost:8080/api/status; then
              echo "Spring Boot application is ready."
              exit 0
            fi
            sleep 5
          done

          echo "Spring Boot application failed to start."
          cat app.log
          exit 1

      # 9. Send Snyk report for AI analysis
      - name: Send Snyk report for AI analysis
        if: steps.snyk_scan.outcome == 'success' && hashFiles('snyk-report.json') != ''
        run: |
          curl --fail-with-body \
            --max-time 600 \
            -X POST \
            -F "file=@snyk-report.json;type=application/json" \
            http://localhost:8080/api/security/analyze \
            -o ai-security-analysis.txt

      # 10. Upload AI analysis
      - name: Upload AI analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snyk-ai-analysis
          path: ai-security-analysis.txt
          if-no-files-found: warn

      # 11. Display AI analysis
      - name: Display AI analysis
        if: always() && hashFiles('ai-security-analysis.txt') != ''
        run: cat ai-security-analysis.txt

      # 12. Debug HIGH and CRITICAL vulnerabilities
      - name: Debug HIGH and CRITICAL vulnerabilities
        if: always() && steps.snyk_scan.outcome == 'success' && hashFiles('snyk-report.json') != ''
        run: |
          jq -r '
            .vulnerabilities[]
            | select(.severity == "high" or .severity == "critical")
            | "Severity: \(.severity)\nTitle: \(.title)\nPackage: \(.packageName)\nVersion: \(.version)\nID: \(.id)\n---"
          ' snyk-report.json

      # 13. Enforce Snyk security policy
      - name: Enforce security policy
        if: always() && steps.snyk_scan.outcome == 'success' && hashFiles('snyk-report.json') != ''
        run: |
          if ! jq -e 'has("vulnerabilities") and (.vulnerabilities | type == "array")' snyk-report.json > /dev/null; then
            echo "Invalid or unexpected Snyk JSON report."
            exit 1
          fi

          HIGH_CRITICAL_COUNT=$(jq '[.vulnerabilities[] | select(.severity == "high" or .severity == "critical")] | length' snyk-report.json)

          echo "HIGH and CRITICAL vulnerabilities: $HIGH_CRITICAL_COUNT"

          if [ "$HIGH_CRITICAL_COUNT" -gt 0 ]; then
            echo "Security policy failed: HIGH or CRITICAL vulnerabilities detected."
            exit 1
          fi

          echo "Security policy passed: no HIGH or CRITICAL vulnerabilities."
