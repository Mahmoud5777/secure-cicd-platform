
name: Secure CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  build-and-test:
    name: Build, Test, Security Scans and AI Analysis
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Detect exposed secrets with Gitleaks
      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 3. Set up Java 21
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 4. Build and run tests
      - name: Build and run tests
        run: chmod +x mvnw && ./mvnw clean verify

      # 5. Verify JaCoCo coverage report
      - name: Verify JaCoCo report
        run: |
          echo "Checking JaCoCo XML report..."
          ls -lah target/site/jacoco/
          test -s target/site/jacoco/jacoco.xml
          echo "JaCoCo report successfully generated."

      # 6. SonarQube Cloud Analysis
      - name: SonarQube Cloud Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./mvnw org.sonarsource.scanner.maven:sonar-maven-plugin:5.3.0.6276:sonar \
            -Dsonar.organization=mahmoud5777 \
            -Dsonar.projectKey=Mahmoud5777_secure-cicd-platform \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.qualitygate.wait=true

      # 7. Install Snyk CLI with locked version
      - name: Install Snyk CLI
        run: |
          mkdir -p "$RUNNER_TEMP/snyk-cli"
          cd "$RUNNER_TEMP/snyk-cli"
          npm init -y
          npm install --save-exact --package-lock=true --ignore-scripts snyk@1.1297.0
          "$RUNNER_TEMP/snyk-cli/node_modules/.bin/snyk" --version

      # 8. Run Snyk security scan
      - name: Run Snyk security scan
        id: snyk_scan
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          set +e
          "$RUNNER_TEMP/snyk-cli/node_modules/.bin/snyk" test --json-file-output=snyk-report.json
          SNYK_EXIT_CODE=$?
          set -e

          echo "Snyk exit code: $SNYK_EXIT_CODE"

          if [ "$SNYK_EXIT_CODE" -ge 2 ]; then
            echo "Snyk scan failed due to a technical error."
            exit "$SNYK_EXIT_CODE"
          fi

          if [ ! -s snyk-report.json ]; then
            echo "Snyk report was not generated."
            exit 1
          fi

      # 9. Upload Snyk report
      - name: Upload Snyk report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snyk-security-report
          path: snyk-report.json
          if-no-files-found: warn

      # 10. Start Spring Boot application
      - name: Start Spring Boot application
        if: steps.snyk_scan.outcome == 'success' && hashFiles('snyk-report.json') != ''
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          nohup ./mvnw spring-boot:run > app.log 2>&1 &
          echo $! > app.pid

          for i in {1..30}; do
            if curl -fsS http://localhost:8080/api/status; then
              echo "Spring Boot application is ready."
              exit 0
            fi
            sleep 5
          done

          echo "Spring Boot application failed to start."
          cat app.log
          exit 1

      # 11. Send Snyk report for AI analysis
      - name: Send Snyk report for AI analysis
        if: steps.snyk_scan.outcome == 'success' && hashFiles('snyk-report.json') != ''
        run: |
          curl --fail-with-body \
            --max-time 600 \
            -X POST \
            -F "file=@snyk-report.json;type=application/json" \
            http://localhost:8080/api/security/analyze \
            -o ai-security-analysis.txt

      # 12. Upload AI analysis
      - name: Upload AI analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snyk-ai-analysis
          path: ai-security-analysis.txt
          if-no-files-found: warn

      # 13. Display AI analysis
      - name: Display AI analysis
        if: always() && hashFiles('ai-security-analysis.txt') != ''
        run: cat ai-security-analysis.txt

      # 14. Debug HIGH and CRITICAL vulnerabilities
      - name: Debug HIGH and CRITICAL vulnerabilities
        if: always() && steps.snyk_scan.outcome == 'success' && hashFiles('snyk-report.json') != ''
        run: |
          jq -r '
            .vulnerabilities[]
            | select(.severity == "high" or .severity == "critical")
            | "Severity: \(.severity)\nTitle: \(.title)\nPackage: \(.packageName)\nVersion: \(.version)\nID: \(.id)\n---"
          ' snyk-report.json

      # 15. Enforce Snyk security policy
      - name: Enforce security policy
        if: always() && steps.snyk_scan.outcome == 'success' && hashFiles('snyk-report.json') != ''
        run: |
          if ! jq -e 'has("vulnerabilities") and (.vulnerabilities | type == "array")' snyk-report.json > /dev/null; then
            echo "Invalid or unexpected Snyk JSON report."
            exit 1
          fi

          HIGH_CRITICAL_COUNT=$(jq '[.vulnerabilities[] | select(.severity == "high" or .severity == "critical")] | length' snyk-report.json)

          echo "HIGH and CRITICAL vulnerabilities: $HIGH_CRITICAL_COUNT"

          if [ "$HIGH_CRITICAL_COUNT" -gt 0 ]; then
            echo "Security policy failed: HIGH or CRITICAL vulnerabilities detected."
            exit 1
          fi

          echo "Security policy passed: no HIGH or CRITICAL vulnerabilities."

      # 16. Build Docker image
      - name: Build Docker image
        run: docker build -t secure-cicd-platform:${{ github.sha }} .

      # 17. Scan Docker image with Trivy
      - name: Trivy Docker image scan
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          image-ref: secure-cicd-platform:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
